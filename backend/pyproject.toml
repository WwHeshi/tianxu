[project]
name = "bazi-agent-backend"
version = "0.1.0"
description = "Deterministic BaZi chart API for the Tianxu agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "lunar-python>=1.4.8,<2.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
